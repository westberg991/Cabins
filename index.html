<!DOCTYPE html>
<html lang="sv" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Friden — off-grid stuga vid Bodtjärnen i Undrom. Koppla bort, elda i vedkaminen och vakna upp till spegelblankt sjövatten." />
  <title>Friden — Off-grid stuga vid Bodtjärnen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    /* ─── THEME SYSTEM ───────────────────────────────────────────
       Semantic naming: --color-bg-*, --color-surface-*, --color-text-*
       WCAG AA: all foreground/bg pairings ≥ 4.5:1
       Dark default; light override via [data-theme="light"]
    ──────────────────────────────────────────────────────────── */

    /* Dark theme (default) — no black; uses elevated dark surfaces */
    :root {
      /* Backgrounds — elevated surfaces get progressively lighter */
      --color-bg-base:      #0d1418;   /* page base */
      --color-bg-raised:    #111b21;   /* cards level 1 */
      --color-bg-elevated:  #1b2b33;   /* cards level 2 */
      --color-bg-overlay:   #223040;   /* hover/focus states */
      --color-nav-bg:       rgba(13,20,24,0.70);

      /* Text */
      --color-text-primary: #e8ede8;   /* 13.1:1 on bg-base ✓ */
      --color-text-secondary:#8fa89a;  /* 5.1:1 on bg-base ✓ */
      --color-text-muted:   #4d6258;

      /* Borders */
      --color-divider:      rgba(232,237,232,0.08);
      --color-border:       rgba(232,237,232,0.12);

      /* Accent */
      --color-accent:       #e8a830;
      --color-accent-hover: #f0bc50;
      --color-accent-dim:   rgba(232,168,48,0.10);
      --color-accent-border:rgba(232,168,48,0.22);

      /* Ghost heading word */
      --color-ghost:        #e8a830;

      /* Map filter */
      --map-filter: grayscale(20%) invert(90%) hue-rotate(170deg) saturate(0.6) brightness(0.85);

      /* Hero overlay */
      --hero-overlay:
        linear-gradient(to top, rgba(13,20,24,0.85) 0%, rgba(13,20,24,0.35) 40%, rgba(13,20,24,0.08) 100%),
        linear-gradient(to right, rgba(13,20,24,0.35) 0%, transparent 65%);

      /* Gallery backdrop tint */
      --gallery-tint: rgba(8,14,18,0.25);

      /* Button */
      --color-btn-bg:       #e8ede8;
      --color-btn-text:     #0d1418;

      --r: 14px;
      --nav-h: 68px;

      /* Transitions on all theme-sensitive props */
      --theme-transition: background-color 300ms ease, color 300ms ease,
                          border-color 300ms ease, box-shadow 300ms ease;
    }

    /* Light theme override */
    [data-theme="light"] {
      /* Backgrounds */
      --color-bg-base:      #f2ede6;   /* warm off-white, not pure #fff */
      --color-bg-raised:    #ffffff;
      --color-bg-elevated:  #f7f3ee;
      --color-bg-overlay:   #ede8e0;
      --color-nav-bg:       rgba(242,237,230,0.88);

      /* Text — dark on light, all ≥ 4.5:1 */
      --color-text-primary: #1a1a14;   /* 15.8:1 on bg-base ✓ */
      --color-text-secondary:#4a5a4e;  /* 7.2:1 on bg-base ✓ */
      --color-text-muted:   #8a9e90;

      /* Borders */
      --color-divider:      rgba(26,26,20,0.10);
      --color-border:       rgba(26,26,20,0.14);

      /* Accent — slightly deeper amber for contrast on light */
      --color-accent:       #b87c10;   /* 5.2:1 on #f2ede6 ✓ */
      --color-accent-hover: #9a6608;
      --color-accent-dim:   rgba(184,124,16,0.10);
      --color-accent-border:rgba(184,124,16,0.25);

      --color-ghost:        #b87c10;

      --map-filter: none;

      --hero-overlay:
        linear-gradient(to top, rgba(26,26,20,0.78) 0%, rgba(26,26,20,0.30) 40%, rgba(26,26,20,0.05) 100%),
        linear-gradient(to right, rgba(26,26,20,0.30) 0%, transparent 65%);

      --gallery-tint: rgba(242,237,230,0.15);

      --color-btn-bg:       #1a1a14;
      --color-btn-text:     #f2ede6;
    }

    /* Alias old variable names to new semantic ones for compatibility */
    :root, [data-theme="light"] {
      --night:   var(--color-bg-base);
      --deep:    var(--color-bg-raised);
      --mist:    var(--color-bg-elevated);
      --fog:     var(--color-bg-overlay);
      --text:    var(--color-text-primary);
      --sub:     var(--color-text-secondary);
      --dim:     var(--color-text-muted);
      --amber:   var(--color-accent);
      --amber-d: var(--color-accent-hover);
      --divider: var(--color-divider);
    }

    /* Apply theme transitions globally — scoped to color props only */
    body, nav, section, footer,
    .fcard, .bcard, .icard, .pcard, .ecard,
    .gallery-viewer, .gallery-backdrop, .map-panel, .map-btn,
    .logo, h1, h2, h3, h4, p, a, li,
    .hero-desc, .section-label, .nav-links a,
    .btn-book, .nav-book, .footer-bottom {
      transition: background-color 300ms ease, color 300ms ease,
                  border-color 300ms ease, box-shadow 300ms ease,
                  filter 300ms ease;
    }

    /* ─── THEME TOGGLE BUTTON ─────────────────────────────────── */
    .theme-toggle {
      position: relative;
      width: 48px;
      height: 26px;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: 99px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 300ms ease, border-color 300ms ease;
      padding: 0;
    }
    .theme-toggle::before {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-accent);
      transition: transform 300ms ease, background 300ms ease;
    }
    [data-theme="light"] .theme-toggle::before {
      transform: translateX(22px);
    }
    /* Sun/moon icons in the toggle */
    .theme-toggle .t-moon,
    .theme-toggle .t-sun {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: .7rem;
      line-height: 1;
      transition: opacity 200ms ease;
      pointer-events: none;
    }
    .theme-toggle .t-moon { left: 6px; opacity: 1; }
    .theme-toggle .t-sun  { right: 6px; opacity: 0.4; }
    [data-theme="light"] .theme-toggle .t-moon { opacity: 0.4; }
    [data-theme="light"] .theme-toggle .t-sun  { opacity: 1; }

    /* ─── LIGHT THEME SPECIFIC OVERRIDES ─────────────────────── */
    [data-theme="light"] nav {
      background: var(--color-nav-bg);
      border-bottom: 1px solid var(--color-divider);
      box-shadow: 0 1px 12px rgba(26,26,20,0.06);
    }
    [data-theme="light"] .fcard,
    [data-theme="light"] .bcard,
    [data-theme="light"] .icard,
    [data-theme="light"] .pcard,
    [data-theme="light"] .ecard,
    [data-theme="light"] .cat-card,
    [data-theme="light"] .map-panel {
      box-shadow: 0 2px 12px rgba(26,26,20,0.06);
    }
    [data-theme="light"] .gallery-viewer {
      background: var(--color-bg-elevated);
    }
    [data-theme="light"] .gallery-backdrop::after {
      background: var(--gallery-tint);
    }
    [data-theme="light"] .gallery-arrow {
      background: rgba(242,237,230,0.80);
      color: var(--color-text-primary);
    }
    [data-theme="light"] .gallery-arrow:hover {
      background: rgba(242,237,230,0.96);
    }
    [data-theme="light"] .map-embed-wrap iframe {
      filter: var(--map-filter);
    }
    [data-theme="light"] .bcard-tip {
      background: var(--color-accent-dim);
      border-color: var(--color-accent-border);
    }
    [data-theme="light"] .ecard-badge {
      background: var(--color-accent-dim);
      border-color: var(--color-accent-border);
    }
    [data-theme="light"] .rating-link {
      border-color: var(--color-accent-border);
    }
    [data-theme="light"] footer {
      background: var(--color-bg-raised);
      border-top: 1px solid var(--color-divider);
    }
    [data-theme="light"] .footer-bottom {
      border-top: 1px solid var(--color-divider);
    }
    [data-theme="light"] .nav-links.open {
      background: var(--color-bg-raised);
      box-shadow: 0 8px 24px rgba(26,26,20,0.10);
    }
    [data-theme="light"] .btn-book {
      background: var(--color-btn-bg);
      color: var(--color-btn-text);
    }
    [data-theme="light"] .btn-book:hover {
      background: var(--color-accent);
      color: var(--color-bg-base);
    }
    [data-theme="light"] .nav-book {
      background: var(--color-btn-bg) !important;
      color: var(--color-btn-text) !important;
    }
    [data-theme="light"] .nav-book:hover {
      background: var(--color-accent) !important;
      color: var(--color-bg-base) !important;
    }

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }

    body {
      background: var(--night);
      color: var(--text);
      font-family: 'Sora', sans-serif;
      font-weight: 300;
      line-height: 1.65;
      overflow-x: hidden;
    }

    /* ─── NAV ────────────────────────────────────────────────── */
    nav {
      position: fixed;
      top:0; left:0; width:100%;
      height: var(--nav-h);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      background: var(--color-nav-bg);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--color-divider);
    }

    .logo {
      font-family: 'Lora', serif;
      font-size: 1.45rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.05em;
      text-decoration: none;
    }
    .logo span { color: var(--amber); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.2rem;
    }
    .nav-links a {
      color: var(--sub);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color .2s;
    }
    .nav-links a:hover { color: var(--text); }
    .nav-book {
      background: var(--text) !important;
      color: var(--night) !important;
      padding: 0.55rem 1.4rem;
      border-radius: 6px;
      font-weight: 600 !important;
      letter-spacing: 0.04em !important;
      text-transform: none !important;
      font-size: 0.85rem !important;
      transition: background .2s, color .2s !important;
    }
    .nav-book:hover { background: var(--amber) !important; color: var(--night) !important; }

    .burger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
      background: none;
      border: none;
    }
    .burger span {
      display: block; width: 22px; height: 2px;
      background: var(--text); border-radius: 2px; transition: .3s;
    }

    /* ─── HERO ───────────────────────────────────────────────── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      padding: calc(var(--nav-h) + 3rem) 5% 5.5rem;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background: url("StugaVyUte.jpg") center / cover no-repeat;
    }
    .hero-bg::after {
      content: '';
      position: absolute; inset: 0;
      background: var(--hero-overlay);
    }
    .hero-content {
      position: relative; z-index: 2; max-width: 740px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 1.4rem;
    }
    .eyebrow::before {
      content: '';
      display: inline-block;
      width: 28px; height: 1.5px;
      background: var(--amber);
    }
    h1 {
      font-family: 'Sora', sans-serif;
      font-size: clamp(3rem, 7vw, 6.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 1.6rem;
    }
    h1 .ghost { color: var(--amber); }

    .hero-desc {
      font-size: 1rem;
      color: rgba(232,237,232,0.90);
      line-height: 1.8;
      max-width: 460px;
      margin-bottom: 2.5rem;
    }
    .hero-cta-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .btn-book {
      display: inline-block;
      background: var(--text);
      color: var(--night);
      text-decoration: none;
      padding: 0.9rem 2.2rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: background .25s, transform .2s;
    }
    .btn-book:hover { background: var(--amber); transform: translateY(-2px); }
    .hero-rating {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text);
      font-size: 1rem;
      font-weight: 400;
    }
    .hero-rating strong { font-size: 1.1rem; font-weight: 600; }
    .star { color: var(--amber); }

    /* ─── SPECS STRIP ────────────────────────────────────────── */
    .specs-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--divider);
      border-bottom: 1px solid var(--divider);
    }
    .spec {
      padding: 2.2rem 5%;
      border-right: 1px solid var(--divider);
    }
    .spec:last-child { border-right: none; }
    .spec-val {
      font-family: 'Lora', serif;
      font-size: 1.9rem;
      font-weight: 400;
      color: var(--amber);
      display: block;
      margin-bottom: 0.25rem;
    }
    .spec-label {
      font-size: 0.72rem;
      color: var(--dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    /* ─── SHARED SECTION ─────────────────────────────────────── */
    section { scroll-margin-top: calc(var(--nav-h) + 8px); }
    .section-inner { padding: 5.5rem 5%; }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 0.9rem;
    }
    .section-label::before {
      content: '';
      display: inline-block;
      width: 20px; height: 1.5px;
      background: var(--amber);
    }
    h2 {
      font-family: 'Sora', sans-serif;
      font-size: clamp(1.7rem, 2.8vw, 2.4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 2.5rem;
      line-height: 1.2;
    }

    /* ─── GALLERY ────────────────────────────────────────────── */
    #gallery { background: var(--deep); }

    .gallery-viewer {
      position: relative;
      width: 100%;
      background: #000000;
      border-radius: var(--r);
      overflow: hidden;
      border: 1px solid var(--divider);
      min-height: 260px;
      display: flex;
      justify-content: center;
    }

    .gallery-backdrop {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: blur(28px) brightness(0.55) saturate(1.2);
      transform: scale(1.15);
      transition: background-image .3s ease;
      z-index: 0;
    }
    .gallery-backdrop::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--gallery-tint);
    }

    .gallery-viewer img,
    .gallery-viewer iframe {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      border: none;
    }

    .gallery-viewer iframe {
      max-width: 380px;
      aspect-ratio: 9 / 16;
      max-height: 70vh;
      z-index: 2;
    }

    .gallery-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(13,20,24,0.65);
      backdrop-filter: blur(6px);
      border: 1px solid var(--divider);
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s;
      z-index: 5;
    }
    .gallery-arrow:hover { background: rgba(13,20,24,0.9); }
    .gallery-arrow.prev { left: .75rem; }
    .gallery-arrow.next { right: .75rem; }

    .gallery-video-badge {
      position: absolute;
      top: .75rem;
      left: .75rem;
      background: rgba(13,20,24,.75);
      backdrop-filter: blur(6px);
      color: var(--amber);
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      padding: .28rem .65rem;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
    }

    .gallery-meta {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-top: .75rem;
    }
    .gallery-counter {
      font-size: .75rem;
      color: var(--dim);
      letter-spacing: .08em;
      white-space: nowrap;
    }
    .gallery-progress-bg {
      flex: 1;
      height: 2px;
      background: var(--divider);
      border-radius: 2px;
      overflow: hidden;
    }
    .gallery-progress-fill {
      height: 100%;
      background: var(--amber);
      border-radius: 2px;
      transition: width .3s ease;
    }

    .gallery-thumbs {
      display: flex;
      gap: 6px;
      margin-top: .75rem;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      scrollbar-color: var(--dim) transparent;
    }
    .gallery-thumbs::-webkit-scrollbar { height: 3px; }
    .gallery-thumbs::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }

    .gallery-thumb-item {
      flex: 0 0 80px;
      height: 56px;
      border-radius: 6px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .2s, opacity .2s;
      opacity: 0.5;
      position: relative;
      background: var(--mist);
    }
    .gallery-thumb-item.active {
      border-color: var(--amber);
      opacity: 1;
    }
    .gallery-thumb-item:hover { opacity: 0.85; }
    .gallery-thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .gallery-thumb-video-icon {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      background: rgba(0,0,0,.35);
    }

    /* ─── INFO ───────────────────────────────────────────────── */
    #info { background: var(--night); }
    .info-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5rem;
      align-items: start;
    }
    .info-lead {
      font-size: 1rem;
      color: var(--sub);
      line-height: 1.85;
      margin-bottom: 1.75rem;
    }
    .info-cards { display: flex; flex-direction: column; gap: 1rem; }
    .icard {
      background: var(--mist);
      border: 1px solid var(--divider);
      border-radius: var(--r);
      padding: 1.6rem 1.75rem;
      border-left: 3px solid var(--amber);
    }
    .icard h4 {
      font-family: 'Lora', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.9rem;
    }
    .icard ul { list-style: none; display: flex; flex-direction: column; gap: .55rem; }
    .icard li {
      color: var(--sub);
      font-size: .85rem;
      display: flex;
      align-items: flex-start;
      gap: .55rem;
      line-height: 1.6;
    }
    .icard li::before { content: '—'; color: var(--dim); flex-shrink: 0; margin-top: .05em; }

    .bcard-img-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin: .25rem 0;
    }
    .bcard-img-grid img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 8px;
    }

    /* ─── SLEEPING / HYGIENE BLOCK ───────────────────────────── */
    #boende { background: var(--deep); }
    .boende-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }
    .bcard {
      background: var(--mist);
      border: 1px solid var(--divider);
      border-radius: var(--r);
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .bcard-icon {
      font-size: 1.8rem;
      line-height: 1;
    }
    .bcard h3 {
      font-family: 'Lora', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }
    .bcard p {
      color: var(--sub);
      font-size: .88rem;
      line-height: 1.75;
    }
    .bcard-tip {
      background: rgba(232,168,48,0.08);
      border: 1px solid rgba(232,168,48,0.18);
      border-radius: 8px;
      padding: .75rem 1rem;
      font-size: .8rem;
      color: var(--amber);
      line-height: 1.55;
    }
    .bcard-tip strong { display: block; margin-bottom: .25rem; font-weight: 600; }

    /* ─── FEATURES ───────────────────────────────────────────── */
    #features { background: var(--night); }
    .feat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }
    .fcard {
      background: var(--mist);
      border: 1px solid var(--divider);
      border-radius: var(--r);
      padding: 2.2rem 1.75rem;
      transition: transform .3s, border-color .3s;
    }
    .fcard:hover { transform: translateY(-4px); border-color: rgba(232,168,48,.25); }
    .ficon { font-size: 1.6rem; margin-bottom: 1.25rem; display: block; }
    .fcard h3 {
      font-family: 'Lora', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: .65rem;
    }
    .fcard p { color: var(--sub); font-size: .87rem; line-height: 1.7; }

    /* ─── UTFORSKA NEARBY ────────────────────────────────────── */
    #utforska { background: var(--deep); }
    .explore-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }
    .ecard {
      background: var(--mist);
      border: 1px solid var(--divider);
      border-radius: var(--r);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .3s, border-color .3s;
    }
    .ecard:hover { transform: translateY(-4px); border-color: rgba(232,168,48,.3); }
    .ecard-head {
      padding: 1.75rem 1.75rem 0;
    }
    .ecard-badge {
      display: inline-block;
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--amber);
      background: rgba(232,168,48,0.1);
      border: 1px solid rgba(232,168,48,0.2);
      border-radius: 4px;
      padding: .2rem .55rem;
      margin-bottom: 1rem;
    }
    .ecard h3 {
      font-family: 'Lora', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: .7rem;
      line-height: 1.3;
    }
    .ecard p {
      color: var(--sub);
      font-size: .86rem;
      line-height: 1.72;
      padding: 0 1.75rem;
    }
    .ecard-foot {
      margin-top: auto;
      padding: 1.25rem 1.75rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ecard-dist {
      font-size: .75rem;
      color: var(--dim);
      display: flex;
      align-items: center;
      gap: .35rem;
    }
    .ecard-link {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .78rem;
      font-weight: 600;
      color: var(--amber);
      text-decoration: none;
      letter-spacing: .04em;
      transition: gap .2s;
    }
    .ecard-link:hover { gap: .55rem; }

    /* ─── PACKLISTA ──────────────────────────────────────────── */
    #packlista { background: var(--night); }
    .pack-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.25rem;
    }
    .pcard {
      background: var(--mist);
      border: 1px solid var(--divider);
      border-radius: var(--r);
      padding: 1.75rem;
    }
    .pcard h4 {
      font-family: 'Lora', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1.1rem;
      padding-bottom: .75rem;
      border-bottom: 1px solid var(--divider);
    }
    .pcard ul { list-style: none; display: flex; flex-direction: column; gap: .6rem; }
    .pcard li {
      color: var(--sub);
      font-size: .85rem;
      display: flex;
      align-items: flex-start;
      gap: .55rem;
      line-height: 1.5;
    }
    .pcard li::before { content: '✓'; color: var(--amber); font-size: .75rem; font-weight: 700; flex-shrink: 0; margin-top: .15em; }

    /* ─── REVIEWS ────────────────────────────────────────────── */
    #reviews { background: var(--deep); }
    .reviews-top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
    }
    .rating-big {
      display: flex;
      align-items: baseline;
      gap: .75rem;
    }
    .rating-num {
      font-family: 'Lora', serif;
      font-size: 4.5rem;
      font-weight: 400;
      color: var(--text);
      line-height: 1;
    }
    .rating-right { display: flex; flex-direction: column; gap: .3rem; }
    .stars-row { display: flex; gap: 3px; }
    .stars-row span { color: var(--amber); font-size: 1.25rem; }
    .rating-count { font-size: .82rem; color: var(--dim); }
    .rating-link {
      display: inline-block;
      margin-top: .5rem;
      font-size: .8rem;
      color: var(--amber);
      text-decoration: none;
      border: 1px solid rgba(232,168,48,.3);
      padding: .45rem 1rem;
      border-radius: 6px;
      transition: background .2s;
    }
    .rating-link:hover { background: rgba(232,168,48,.08); }
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
    }
    .cat-card {
      background: var(--mist);
      border: 1px solid var(--divider);
      border-radius: var(--r);
      padding: 1.5rem 1.25rem;
      text-align: center;
    }
    .cat-icon { font-size: 1.5rem; display: block; margin-bottom: .75rem; }
    .cat-label {
      font-size: .78rem;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: .1em;
      display: block;
      margin-bottom: .65rem;
    }
    .cat-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(232,237,232,.08);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: .45rem;
    }
    .cat-bar-fill {
      height: 100%;
      background: var(--amber);
      border-radius: 4px;
    }
    .cat-score {
      font-size: .82rem;
      font-weight: 600;
      color: var(--amber);
    }

    /* ─── MAP ────────────────────────────────────────────────── */
    #karta { background: var(--night); }
    .map-layout {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 2rem;
      align-items: start;
    }
    .map-embed-wrap {
      border-radius: var(--r);
      overflow: hidden;
      border: 1px solid var(--divider);
      line-height: 0;
    }
    .map-embed-wrap iframe {
      width: 100%;
      height: 440px;
      border: none;
      display: block;
      filter: var(--map-filter);
    }
    .map-panel {
      background: var(--mist);
      border: 1px solid var(--divider);
      border-radius: var(--r);
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .map-address {
      display: flex;
      flex-direction: column;
      gap: .4rem;
    }
    .map-address-label {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .map-address-text {
      font-size: .95rem;
      color: var(--text);
      line-height: 1.55;
    }
    .map-address-coord {
      font-size: .75rem;
      color: var(--dim);
      font-family: monospace;
    }
    .map-divider { height: 1px; background: var(--divider); }
    .map-cta-head {
      font-size: .78rem;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: .1rem;
    }
    .map-btns { display: flex; flex-direction: column; gap: .65rem; }
    .map-btn {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .85rem 1.1rem;
      border-radius: 8px;
      font-size: .87rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--divider);
      background: rgba(232,237,232,.03);
      color: var(--text);
      transition: background .2s, border-color .2s;
      font-family: 'Sora', sans-serif;
      width: 100%;
      text-align: left;
    }
    .map-btn:hover { background: rgba(232,237,232,.07); border-color: rgba(232,237,232,.18); }
    .map-btn-icon { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .map-btn-sub {
      font-size: .72rem;
      color: var(--dim);
      display: block;
      margin-top: .1rem;
      font-weight: 300;
    }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    footer {
      background: var(--deep);
      border-top: 1px solid var(--divider);
      padding: 4rem 5%;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 3rem;
      margin-bottom: 3rem;
    }
    .foot-brand .logo { font-size: 1.3rem; display: block; margin-bottom: .5rem; }
    .foot-brand p { font-size: .82rem; color: var(--dim); line-height: 1.6; max-width: 280px; }
    .foot-col h5 {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 1rem;
    }
    .foot-col ul { list-style: none; display: flex; flex-direction: column; gap: .55rem; }
    .foot-col li a, .foot-col li {
      font-size: .85rem;
      color: var(--sub);
      text-decoration: none;
      transition: color .2s;
    }
    .foot-col li a:hover { color: var(--amber); }
    .footer-bottom {
      border-top: 1px solid var(--divider);
      padding-top: 1.5rem;
      font-size: .75rem;
      color: var(--dim);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .5rem;
    }

    /* ─── REVEAL ─────────────────────────────────────────────── */
    [data-r] {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .75s ease, transform .75s ease;
    }
    [data-r].on { opacity: 1; transform: none; }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    @media (max-width: 1024px) {
      .explore-grid { grid-template-columns: 1fr 1fr; }
      .map-layout { grid-template-columns: 1fr; }
      .map-panel { flex-direction: row; flex-wrap: wrap; gap: 1.25rem; }
      .map-btns { flex-direction: row; flex-wrap: wrap; }
      .map-btn { width: auto; }
    }
  </style>
</head>
